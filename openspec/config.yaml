schema: spec-driven

context: |
  语言：所有产物（proposal / design / tasks / specs）用简体中文撰写。
  项目：logcat —— C# / .NET 10 WinForms 桌面日志查看器，主打 Android logcat 格式。
  文档红线：公开仓库、双站推送。产物不得硬编码本机绝对路径或用户名；openspec/ 与 docs/ 公开内容一律视为对克隆者可见；docs/private/** 的内容不进任何产物。
  规范定位：openspec/specs/ 是系统行为的权威描述——只写行为契约（需求 + GIVEN/WHEN/THEN 场景），不写实现细节；类名、库选择、算法取舍归属 design.md。
  规范冻结粒度：只写行为契约。任何后续变更都要遵守的骨架（结果形状、错误通道、输出通道分工、生命周期）写进规范；取值本身可被调用方分支的对外契约（如错误码值）亦写进规范；当前实现状态（当前能力集内容、当前工具清单与字段清单、当前实现取舍）不写进规范，归 design.md。
  规范分层（按模块）：落位形如 `specs/<模块>/<capability>/spec.md`。模块固定为 viewer（C# WinForms 日志查看器）、uicore（两应用共享的 C# UI 库）、android-tools（安卓工具箱 exe）、next（Avalonia 新界面宿主）、logcore（Rust core 宿主）、mcp（MCP 服务端宿主）。capability 名全局唯一：同一 capability 名不得在两个模块下并存。落位判据是「这段契约由谁的代码执行」，不是谁先写的。新增模块须先在本段登记，不得为「预留」建空目录。
  规范迁移：动谁迁谁。一次 change 要修改的 capability 若已归或即将归另一模块执行，须在同一 change 内把该 capability 整条迁入目标模块，不得原地 MODIFY；迁移完成后源模块下不得残留旧副本。capability 只有部分行为归新宿主时，先按宿主边界拆成两条（留在原模块的那条须改名以体现边界），再迁出承接新宿主的那条。目录搬运不在 openspec CLI 能力内（openspec spec 只有 show / list / validate），一律手工 git mv 并写进 change 的 tasks。无契约内容变化的整目录重命名 / 分层重组同样走 change：建 `skip_specs: true` 的 change 记录 git mv，随其 archive 归档，archive 不改需求内容。
  文档口径：docs/archive/、docs/bugfixes/、docs/design/、docs/private/**、docs/FEATURES.md 不再维护（待删除），不更新、不作依据、不新建链接。
  探索规范：探索结果生成文档放 openspec/notes/；以代码或 Log 为事实，可跑探针测试取证，不猜测；猜测内容显式标注为猜测；待澄清问题写清——为什么需要澄清、有哪些方案、当前偏向哪个。
  易错行为规则（如横幅行不是记录、空行续行处理、索引块起点顺序推进）随相关改动沉淀进 specs/ 对应 capability，不依赖私有文档传递。

rules:
  proposal:
    - 必须显式写出范围与非目标（out of scope）
    - 存量项目：只描述 delta（ADDED/MODIFIED/REMOVED），不重述整个规范
  specs:
    - 每条需求至少一个 GIVEN/WHEN/THEN 场景
    - 禁止出现类名、文件路径等实现细节
    - 落位形如 `specs/<模块>/<capability>/spec.md`；模块：viewer / uicore / android-tools / next / logcore / mcp。分层与迁移规则见 context 的「规范分层」与「规范迁移」
    - capability 名全局唯一，不得在两个模块下并存同名 capability
    - spec.md 首行标题为 `<模块>/<capability> Specification`，与 spec id 一致
  design:
    - 关键技术决策必须附理由；优先引用项目现有模式，不发明新模式
  tasks:
    - 单任务粒度约 1-2 小时、可独立验证
    - 涉及日志解析 / 索引 / 扫描的任务必须附对应测试用例名
    - 首条记录本次 apply 的 worktree 标识（分支名 wt/<change-name>，路径以 git worktree list 定位；禁写本机绝对路径）
    - 必须包含「wt 合入目标分支」任务，并写明合入的目标分支名（默认主分支）；归档前该任务须勾选关闭

operations:
  apply:
    guidance:
      - 严格按 tasks.md 逐条实现，不夹带任务外改动
      - 每完成一批任务跑一次测试并报告口径数字（测试口径见 docs/TESTING.md）
      - 仅在收到用户明确 apply 指令后开始；在 change 专属的独立 git worktree 中实施（git worktree add 需当轮授权），worktree 标识记入 tasks.md 首条
  archive:
    guidance:
      - 归档前确认 tasks 全部关闭（含「wt 合入目标分支」任务），且 wt/<change-name> 已合入 tasks 指定的目标分支
      - 归档前确认测试全过（相对基线无新增失败；口径见 docs/TESTING.md）
      - 归档时同批将关联探索笔记移入 openspec/notes/archive/（git mv + 归档日期前缀），此后不再维护
      - 归档时同步清除该 change 的 git worktree（git worktree remove）；用户「可以归档」一并授权该次 wt 合入、归档与 worktree 清除
