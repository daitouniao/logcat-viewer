[package]
name = "logcore_core"
version.workspace = true
edition = "2021"
description = "logcat source-acquire core: parse, index, sidecar and orchestration"
publish = false

[lib]
name = "logcore_core"

[features]
test-support = []

[dependencies]
arc-swap = "1"
regex = "1.13"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }
