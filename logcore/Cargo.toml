[package]
name = "logcore"
version = "0.1.0"
edition = "2021"
description = "logcat source-acquire core (plan/commit/feed/events/sidecar)"
publish = false

[lib]
name = "logcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Security",
] }

[[bin]]
name = "logcore-test-proxy"
path = "src/bin/test_proxy.rs"