name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # WinForms (net10.0-windows) 无法在 Linux 上编译运行，测试必须在 Windows 上跑
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.config 已配置可用源（<clear/> 覆盖全局源），此处只需还原 + 测试
      - name: Restore
        run: dotnet restore tests/logcat.Tests/logcat.Tests.csproj

      - name: Test
        run: dotnet test tests/logcat.Tests/logcat.Tests.csproj --no-restore -v minimal
