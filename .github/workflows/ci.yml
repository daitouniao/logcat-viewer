name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # WinForms (net10.0-windows) 无法在 Linux 上编译运行，测试必须在 Windows 上跑
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # NuGet.config 已用<clear/> 覆盖全局源（全局的 nuget.cdn.azure.cn 已下线，
      # 会 NU1301）。CI 必须在仓库根执行才能读到它 —— 所有路径都用相对根目录的写法。
      - name: Show environment
        run: |
          Write-Host "--- dotnet ---"
          dotnet --info
          Write-Host "--- nuget sources ---"
          dotnet nuget list source

      # 36 条 logcore 集成测试会经 FFI 调真实 core，缺 logcore/target/debug/logcore.dll
      # 时在测试类构造函数里整批失败（LogcoreTestSupport.EnsureLibrary）。
      # 仓库根是 Cargo workspace（crates/core、crates/cabi、crates/cli）；target 目录由
      # 根 .cargo/config.toml 固定到 logcore/target，产物路径不变。Cargo.lock 已入库。
      - name: Build logcore
        run: cargo build

      # 先单独 build，把"编译失败"和"测试失败"分成两步，
      # 否则两者都只表现为 exit code 1，日志里看不出是哪一种。
      - name: Build
        run: dotnet build tests/logcat.Tests/logcat.Tests.csproj -c Release -v normal

      # 不加 --no-restore：让 restore 与 build 的产物保持一致，
      # 避免 ProjectReference 主工程的 assets 与测试工程不同步。
      #
      # ── 语言环境：显式钉成 en-US ──
      # 界面语言由 logcat-uicore/Services/Loc.cs 静态构造期按 CurrentUICulture 探测，
      # 无 settings.json 时完全由系统区域决定 → 本地 zh-CN、runner en-US。
      # 历史上 CI 有 4 次因此翻车（10-09 ×2、10-10、10-18），症状是
      # 「本地全绿、推送就红」：某些用例把本地化文案硬编码成中文断言。
      #
      # windows-latest 本身就是 en-US。注意：LANG / LC_ALL 只在 Unix 生效，
      # Windows 上不改变 .NET 的 CurrentUICulture（2026-10-24 实测），故不能靠它们
      # 真正钉住语言；真正生效的是 LOGCAT_FORCE_UI_CULTURE——测试程序集的
      # TestCultureBootstrap（ModuleInitializer）在进程内设置区域并由
      # CiLocaleAssertionTests.强制界面语言已生效 硬校验。
      # 本地想复现这套环境：bash scripts/run-tests-en-us.sh
      - name: Test
        env:
          LOGCAT_FORCE_UI_CULTURE: en-US
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
          DOTNET_CLI_UI_LANGUAGE: en-US
        run: >
          dotnet test tests/logcat.Tests/logcat.Tests.csproj
          -c Release --no-build -v normal --logger "console;verbosity=detailed"

      # 新 UI 宿主（logcat-next/）的独立测试工程：net10.0、不依赖桌面框架与界面语言，
      # 装载层复用上面 cargo build 的 logcore.dll。与主仓用例数互不相加。
      - name: Build Next.Tests
        run: dotnet build logcat-next/Next.Tests/Next.Tests.csproj -c Release -v normal

      - name: Test Next.Tests
        run: dotnet test logcat-next/Next.Tests/Next.Tests.csproj -c Release --no-build -v normal

      # 测试失败时把完整日志也吐出来，便于在网页上直接看到失败用例名。
      - name: Upload test logs on failure
        if: failure()
        run: |
          Get-ChildItem -Recurse -Filter "*.trx" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName }
          Get-ChildItem -Recurse -Path tests -Filter "*.log" -ErrorAction SilentlyContinue |
            Where-Object { $_.DirectoryName -like "*tmp*" } |
            Select-Object -First 20 |
            ForEach-Object { Write-Host "=== $($_.FullName) ==="; Get-Content $_.FullName -TotalCount 50 }

  # Rust core 的 UT（crates/core + crates/cabi），与上面 C# 作业的覆盖互不相加。
  # 必须串行：代理实例注册表与 shutdown 是进程全局状态，默认并行互踩（实测 9 条伪失败）。
  # 工具链由仓库根 rust-toolchain.toml 钉住，rustup 自动安装；Cargo.lock 已入库。
  rust:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust UT (serial)
        run: cargo test --workspace -- --test-threads=1

  # MCP 服务端（Node，mcp/）：独立的 stdio 服务端工程，与 .NET 主工程无耦合，
  # 故单开一个作业——Node 装好就能跑，不必等 .NET 那一摊。
  mcp:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp
    strategy:
      fail-fast: false
      matrix:
        # 26 = 当前 Active LTS（Lithium，2026-10-28 进入 LTS），与本机开发环境同版本；
        # 22 = 仍在维护的最老 LTS（Jod），作为支持下限一并验证。
        # 两个版本都跑，是为了避免「本地全绿、推送就红」——历史上正是在版本漂移上翻过车。
        node-version: ['26', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SDK 本身要求 Node ≥ 20；本工程的开发/测试流程要求 ≥ 22.6（测试运行器的 glob 支持）。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show environment
        run: |
          Write-Host "--- node ---"
          node --version
          Write-Host "--- npm ---"
          npm --version

      # 锁文件入库，用 ci 严格按锁定版本安装，不让传递依赖漂移。
      - name: Install dependencies
        run: npm ci

      # 构建与测试分开两步：编译失败与用例失败在日志里要能区分开。
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # MCP 代理（Node，mcp/proxy/）：独立工程，Node 版本矩阵与 mcp 作业一致。
  # 端到端用例以仓库内的 logcat-mcp 为真实上游，故先构建 mcp/ 再跑代理测试。
  mcp-proxy:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['26', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show environment
        run: |
          Write-Host "--- node ---"
          node --version
          Write-Host "--- npm ---"
          npm --version

      # 端到端用例的真实上游是 logcat-mcp：先按锁文件装依赖并构建它。
      - name: Build logcat-mcp (e2e upstream)
        working-directory: mcp
        run: |
          npm ci
          npm run build

      - name: Install dependencies
        working-directory: mcp/proxy
        run: npm ci

      - name: Build
        working-directory: mcp/proxy
        run: npm run build

      - name: Test
        working-directory: mcp/proxy
        run: npm test